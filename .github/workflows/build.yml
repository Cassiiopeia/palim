name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: 커밋 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 커밋 메시지에 AI 관여 흔적이 들어가면 실패시킨다 (CLAUDE.md 금지사항 8).
      # 규칙 문서만으로는 강제되지 않으므로 CI 가 게이트다.
      - name: AI 흔적 차단
        run: |
          RANGE="${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"
          if ! git rev-list "$RANGE" >/dev/null 2>&1; then
            RANGE="${{ github.sha }} -1"
          fi
          BAD=$(git log --format='%H %B%x00' $RANGE 2>/dev/null \
            | grep -iaE 'co-authored-by:.*(claude|anthropic)|generated with.*(claude|ai)|noreply@anthropic\.com|🤖' || true)
          if [ -n "$BAD" ]; then
            echo "::error::커밋 메시지에 AI 흔적이 있습니다. 해당 커밋을 reword 하십시오."
            echo "$BAD"
            exit 1
          fi

      # 사내 참고 자료는 어떤 경로로도 공개 저장소에 들어가면 안 된다.
      - name: 사내 자료 차단
        run: |
          if git ls-files | grep -E '^docs/somansa/|somansa.*redmine|redmine.*attachments'; then
            echo "::error::사내 참고 자료가 추적되고 있습니다. 즉시 제거하십시오."
            exit 1
          fi

  build:
    name: Gradle 빌드
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 및 테스트
        run: ./gradlew build

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/"
          retention-days: 7

  image:
    name: GHCR 이미지 푸시
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 실행 가능 jar 생성
        run: ./gradlew :palim-app:bootJar

      # SBOM (09-SECURITY) — 배포 시점의 전체 의존성 목록. 취약점 공지가 나왔을 때
      # "우리가 그 버전을 쓰는가"를 빌드 재현 없이 답할 수 있게 한다.
      - name: SBOM 생성
        run: ./gradlew cyclonedxBom

      - name: SBOM 업로드
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/reports/bom.json
          retention-days: 90

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 롤백은 이전 커밋 SHA 태그를 pull 하는 것으로 완료된다 (설계서 9.1)
          tags: |
            ghcr.io/cassiiopeia/palim:${{ github.sha }}
            ghcr.io/cassiiopeia/palim:latest
