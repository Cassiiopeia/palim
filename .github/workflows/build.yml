name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: 커밋 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 커밋 메시지에 AI 관여 흔적이 들어가면 실패시킨다 (CLAUDE.md 금지사항 8).
      # 규칙 문서만으로는 강제되지 않으므로 CI 가 게이트다.
      - name: AI 흔적 차단
        run: |
          RANGE="${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}"
          if ! git rev-list "$RANGE" >/dev/null 2>&1; then
            RANGE="${{ github.sha }} -1"
          fi
          BAD=$(git log --format='%H %B%x00' $RANGE 2>/dev/null \
            | grep -iaE 'co-authored-by:.*(claude|anthropic)|generated with.*(claude|ai)|noreply@anthropic\.com|🤖' || true)
          if [ -n "$BAD" ]; then
            echo "::error::커밋 메시지에 AI 흔적이 있습니다. 해당 커밋을 reword 하십시오."
            echo "$BAD"
            exit 1
          fi

      # 사내·발주사 맥락이 담긴 자료는 어떤 경로로도 공개 저장소에 들어가면 안 된다.
      # docs/archive 는 과거 요구사항 문서라 로컬에는 두되 추적하지 않는다.
      - name: 사내 자료 차단
        run: |
          if git ls-files | grep -E '^docs/somansa/|^docs/archive/|^\.local/|somansa.*redmine|redmine.*attachments'; then
            echo "::error::사내·발주사 자료가 추적되고 있습니다. 즉시 제거하십시오."
            exit 1
          fi

      # 배포 대상을 지목하는 값이 파일에 새는 것을 막는다. 이 저장소는 공개이고
      # 남이 그대로 가져다 쓰므로, 환경 특정 값은 전부 Secret 에만 있어야 한다.
      - name: 인프라 식별정보 차단
        run: |
          HITS=$(git ls-files -z \
            | xargs -0 grep -nIE '([A-Za-z0-9-]+\.(synology\.me|myds\.me)|/volume[0-9]+/)' \
              2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::서버 호스트명·내부 경로가 추적 파일에 있습니다. Secret 으로 옮기십시오."
            echo "$HITS"
            exit 1
          fi

  build:
    name: Gradle 빌드
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 및 테스트
        run: ./gradlew build

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/reports/tests/"
          retention-days: 7

  image:
    name: GHCR 이미지 푸시
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: JDK 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # 운영 설정을 Secret 에서 만들어 jar 에 넣는다. 이 파일은 gitignore 대상이라
      # 저장소에는 없다. 설정 값은 전부 이 Secret 하나에서 관리한다 — 값을 바꾸려면
      # APPLICATION_PROD_YML 을 수정하고 main 에 push 한다.
      - name: 운영 설정 생성
        env:
          APPLICATION_PROD_YML: ${{ secrets.APPLICATION_PROD_YML }}
        run: |
          if [ -z "$APPLICATION_PROD_YML" ]; then
            echo "::error::APPLICATION_PROD_YML secret 이 비어 있습니다."
            exit 1
          fi
          printf '%s\n' "$APPLICATION_PROD_YML" \
            > palim-app/src/main/resources/application-prod.yaml

      - name: 실행 가능 jar 생성
        run: ./gradlew :palim-app:bootJar

      # SBOM (09-SECURITY) — 배포 시점의 전체 의존성 목록. 취약점 공지가 나왔을 때
      # "우리가 그 버전을 쓰는가"를 빌드 재현 없이 답할 수 있게 한다.
      - name: SBOM 생성
        run: ./gradlew cyclonedxBom

      - name: SBOM 업로드
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: build/reports/bom.json
          retention-days: 90

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # 롤백은 이전 커밋 SHA 태그를 pull 하는 것으로 완료된다 (설계서 9.1)
          tags: |
            ghcr.io/cassiiopeia/palim:${{ github.sha }}
            ghcr.io/cassiiopeia/palim:latest

  deploy:
    name: NAS 배포
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # latest 가 아니라 SHA 태그로 배포한다. latest 는 다음 배포에 덮이므로
      # "지금 서버에 뭐가 떠 있나"를 나중에 되짚을 수 없다.
      IMAGE_REF: ghcr.io/cassiiopeia/palim:${{ github.sha }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # docker run 인자로만 쓰는 값. 애플리케이션 설정이 아니라 yml 에 넣을 자리가 없다.
      # 저장소가 공개이므로 배포 환경을 지목하는 값은 파일에 두지 않는다.
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_NETWORK: ${{ secrets.DEPLOY_NETWORK }}
      # 로그를 남길 호스트 디렉터리. 컨테이너는 배포마다 지웠다 다시 만들므로 로그를 밖에
      # 두지 않으면 어제 것이 남지 않는다. 서버 경로이므로 파일에 두지 않는다.
      DEPLOY_LOG_DIR: ${{ secrets.DEPLOY_LOG_DIR }}
    steps:
      - name: SSH 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          timeout: 60s
          command_timeout: 600s
          envs: IMAGE_REF,GHCR_USER,GHCR_TOKEN,DEPLOY_PORT,DEPLOY_NETWORK,DEPLOY_LOG_DIR
          script: |
            set -euo pipefail
            # 컨테이너 런타임 경로. PATH 에 docker 가 없는 호스트(예: NAS 패키지 설치)를
            # 위해 후보를 순서대로 찾는다.
            D=$(command -v docker 2>/dev/null || true)
            for c in /var/packages/ContainerManager/target/usr/bin/docker \
                     /usr/local/bin/docker /usr/bin/docker; do
              [ -n "$D" ] && break
              [ -x "$c" ] && D="$c"
            done
            [ -n "$D" ] || { echo "::error::docker 실행 파일을 찾지 못했습니다"; exit 1; }

            echo "$GHCR_TOKEN" | "$D" login ghcr.io -u "$GHCR_USER" --password-stdin
            "$D" pull "$IMAGE_REF"

            # DB 접속 정보는 이미지 안 application-prod.yaml 에 들어 있다. 여기서는
            # 네트워크만 맞춰 주면 된다 — 같은 네트워크여야 컨테이너 이름으로 붙는다.
            # 로그 디렉터리를 미리 만든다. 없으면 docker 가 root 소유로 만들어 버려
            # 나중에 사람이 파일을 지우거나 옮길 수 없다.
            mkdir -p "$DEPLOY_LOG_DIR"

            "$D" rm -f palim >/dev/null 2>&1 || true
            "$D" run -d --name palim \
              --restart unless-stopped \
              --network "$DEPLOY_NETWORK" \
              -p "${DEPLOY_PORT}:8080" \
              -e TZ=Asia/Seoul \
              -e SPRING_PROFILES_ACTIVE=prod \
              -v /etc/localtime:/etc/localtime:ro \
              -v "${DEPLOY_LOG_DIR}:/mnt/palim/logs" \
              "$IMAGE_REF"

            "$D" logout ghcr.io >/dev/null 2>&1 || true

            # 기동 확인. Flyway 마이그레이션이 끝나야 UP 이 되므로 넉넉히 기다린다.
            # curl 이 없는 호스트가 많아 wget 을 함께 시도한다.
            check() {
              if command -v curl >/dev/null 2>&1; then
                curl -fsS "http://127.0.0.1:${DEPLOY_PORT}/actuator/health" 2>/dev/null
              else
                wget -q -O - "http://127.0.0.1:${DEPLOY_PORT}/actuator/health" 2>/dev/null
              fi
            }
            for i in $(seq 1 40); do
              if check | grep -q '"status":"UP"'; then
                echo "기동 확인 ($((i * 5))초)"
                "$D" image prune -af >/dev/null 2>&1 || true
                exit 0
              fi
              sleep 5
            done

            echo "::error::기동 확인 실패 — 아래는 컨테이너 로그다"
            "$D" logs --tail 120 palim
            exit 1
