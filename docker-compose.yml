# 로컬 개발용. 포트는 전부 루프백(127.0.0.1)에만 연다.
#
# 인터페이스를 지정하지 않으면 0.0.0.0 에 바인딩되는데, 도커는 iptables 규칙을 직접 넣기
# 때문에 호스트 방화벽(ufw 등) 설정을 우회한다. "방화벽이 있으니 괜찮다" 가 성립하지 않는다.
services:
  postgres:
    # 운영과 같은 메이저 버전을 쓴다. 로컬만 높이면 상위 버전 전용 문법이 여기서는 멀쩡히
    # 돌다가 배포에서만 죽는다 — 실제로 NULLS NOT DISTINCT(PG15+)가 그렇게 통과했다.
    image: postgres:14-alpine
    container_name: palim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-palim}
      POSTGRES_USER: ${DB_USER:-palim}
      # 기본값을 두지 않는다. 저장소가 공개이므로 기본 비밀번호를 적어 두면 그 값이 곧
      # 공개된 자격증명이 되고, .env 를 만들지 않은 사람의 DB 가 그 값으로 뜬다.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하십시오}
      TZ: UTC
    ports:
      # 루프백 고정 — 위 주석 참고.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-palim} -d ${DB_NAME:-palim}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 현재 애플리케이션은 RabbitMQ 를 사용하지 않는다.
  #
  # 알림 재시도는 PostgreSQL Outbox 가 관리하며(attemptCount), 큐를 함께 두면 재시도 근거가
  # 두 곳으로 갈려 어느 쪽이 진실인지 알 수 없게 된다. 발송 워커를 별도 프로세스로 분리하거나
  # 부하가 늘어나면 다시 붙인다.
  #
  # profiles 를 붙여 기본 기동에서 빼 둔다. 이게 없으면 `docker compose up` 만으로
  # 관리 UI(15672)가 함께 뜬다. 필요할 때만 `--profile queue` 로 올린다.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: palim-rabbitmq
    restart: unless-stopped
    profiles: ["queue"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-palim}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 를 .env 에 설정하십시오}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  rabbitmqdata:
