services:
  postgres:
    image: postgres:17-alpine
    container_name: palim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-palim}
      POSTGRES_USER: ${DB_USER:-palim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-palim}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-palim} -d ${DB_NAME:-palim}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 현재 애플리케이션은 RabbitMQ 를 사용하지 않는다.
  #
  # 알림 재시도는 PostgreSQL Outbox 가 관리하며(attemptCount), 큐를 함께 두면 재시도 근거가
  # 두 곳으로 갈려 어느 쪽이 진실인지 알 수 없게 된다. 발송 워커를 별도 프로세스로 분리하거나
  # 부하가 늘어나면 다시 붙인다. 그때까지 이 컨테이너는 띄우지 않아도 된다.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: palim-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-palim}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-palim}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  rabbitmqdata:
