services:
  postgres:
    image: postgres:17-alpine
    container_name: palim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-palim}
      POSTGRES_USER: ${DB_USER:-palim}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-palim}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-palim} -d ${DB_NAME:-palim}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: palim-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-palim}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-palim}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  rabbitmqdata:
