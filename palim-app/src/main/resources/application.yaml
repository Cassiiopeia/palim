spring:
  application:
    name: palim
  profiles:
    default: dev

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 관리한다. 애플리케이션은 검증만 수행한다 (설계서 1장)
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # 전 계층 Instant / timestamptz 사용 (설계서 4.3)
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

  messages:
    # 에러 메시지는 errors.properties(한국어) / errors_en.properties(영문) 두 파일에 모은다.
    # 새 ErrorCode 를 추가하면 두 파일에 한 줄씩 더하면 되고, 이 설정은 손대지 않는다.
    basename: errors
    encoding: UTF-8
    # 키가 없으면 예외 대신 키를 반환한다. 누락은 ErrorCodeIntegrationTest 가 잡는다.
    use-code-as-default-message: true
    # 반드시 false 여야 한다.
    #
    # MessageSource 는 "요청 로케일 → 시스템 로케일 → 기본 번들" 순으로 찾는다. 이 값이 true 면
    # ko 요청에 errors_ko.properties 가 없을 때 시스템 로케일로 넘어가는데, 서버 로케일이 en 이면
    # 한국어를 요청했는데 영문이 나간다. 즉 배포 환경의 OS 설정이 사용자에게 보이는 언어를 바꾼다.
    # false 로 두면 시스템 로케일을 건너뛰고 기본 번들(한국어)로 떨어진다.
    fallback-to-system-locale: false

palim:
  telegram:
    # 없으면 알림이 Outbox 에 쌓이기만 한다. 암호화 마스터키와 달리 기동을 막지 않는다 —
    # 발주자가 나중에 설정하는 항목이고, 대기 중 알림은 유실되지 않기 때문이다.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    api-base-url: https://api.telegram.org
    timeout: 10s
    max-attempts: 5

  notification:
    relay-delay: 30000

  youtube:
    # YouTube Data API v3 키 (Google Cloud Console 에서 발급).
    # 저장소가 공개이므로 환경변수로만 주입한다. 없으면 기동은 되되 수집이 건너뛴다.
    #
    # 이 API 는 무료다 — 과금이 아니라 일 10,000 units 할당량으로 제한된다. 초과하면 403 이
    # 떨어지고 태평양시 자정에 초기화되므로, 우리가 관리할 것은 비용이 아니라 예산 배분이다
    # (검색 100 units vs 나머지 1 unit — youtube_quota_ledger 가 이를 기록한다).
    #
    # 키에는 서버 IP 제한을 걸어둔다. 유출되어도 남이 우리 할당량을 소모할 수 없다.
    api-key: ${YOUTUBE_API_KEY:}
    base-url: https://www.googleapis.com/youtube/v3


  monitor:
    # 재고 정합성 대조. 본 시스템은 스스로를 재고의 유일한 기준으로 정의하므로
    # 자기 검산이 없으면 틀어진 상태로 장기간 운영된다.
    stock-consistency-delay: 24h
    low-stock-delay: 30m
    # 발송 시각은 설정값(dailyReportTime)이라 cron 을 쓸 수 없다. 주기적으로 확인한다.
    daily-report-delay: 5m
    mismatch-alert-interval: 24h
    top-sku-limit: 3

  channel:
    coupang:
      api-base-url: https://api-gateway.coupang.com
      # 규정은 초당 10회(100ms)지만 지속 초과 시 계정이 영구 차단되므로 여유를 둔다.
      # 페이징 순회 중에도 이 간격을 지킨다.
      min-request-interval: 150ms
      page-size: 50
      # nextToken 이 예상과 다르게 동작하면 무한 루프가 되고, 그 상태로 호출 제한을
      # 초과하면 계정이 차단된다.
      max-pages: 100
      timeout: 30s

  collect:
    # 조회 구간 겹침 여유. 채널 API 는 주문 시각이 지연 반영되므로 구간을 정확히 이어붙이면
    # 경계에서 주문이 누락된다. 중복은 유니크 제약이 막지만 누락은 감지되지 않는다.
    overlap: 10m
    initial-lookback: 24h
    failure-threshold: 3
    scheduler-delay: 60000
    reconcile-delay: 300000

  crypto:
    # 채널 API 인증정보 AES-GCM 마스터키 (설계서 6.2)
    # 없으면 기동에 실패한다. 암호화 없이 인증정보를 저장하는 상태로 뜨지 않게 하기 위함이다.
    # 생성 — openssl rand -base64 32
    master-key: ${PALIM_CRYPTO_MASTER_KEY}
  admin:
    # 계정이 없을 때만 사용된다. 이미 있으면 비밀번호를 덮어쓰지 않는다.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

  auth:
    # 연속 로그인 실패가 이 횟수에 도달하면 계정을 잠근다. 성공하면 카운트가 초기화된다.
    max-login-failure: 5
    lock-duration: 10m
    # 중복 로그인 확인 대기 유효시간. 확인창을 띄워둔 채 방치하면 만료된다.
    pending-login-timeout: 2m

  audit:
    # 감사 로그 보존 일수. 조회 기록까지 남으므로 정리하지 않으면 디스크가 먼저 찬다.
    retention-days: 365

server:
  servlet:
    session:
      # 유휴 세션 만료. 관리자가 화면을 열어둔 채 자리를 떠도 무한정 유지되지 않게 한다.
      # 이 화면은 재고 수정과 채널 인증정보 등록을 수행하므로 세션 탈취가 매출에 직결된다.
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    kr.suhsaechan.palim: DEBUG
