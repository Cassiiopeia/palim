spring:
  application:
    name: palim
  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 관리한다. 애플리케이션은 검증만 수행한다 (설계서 1장)
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # 전 계층 Instant / timestamptz 사용 (설계서 4.3)
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

  messages:
    # 에러 메시지는 각 도메인 모듈이 소유한다. 새 도메인을 추가하면 여기에 한 줄만 더한다.
    # 파일명이 달라 classpath 병합 시 충돌하지 않는다.
    basename: >-
      errors/common,
      errors/sku,
      errors/order,
      errors/mapping,
      errors/channel,
      errors/notification,
      errors/auth
    encoding: UTF-8
    # 키가 없으면 예외 대신 ErrorCode 이름을 반환한다. 누락은 검증 테스트가 잡는다.
    use-code-as-default-message: true

palim:
  crypto:
    # 채널 API 인증정보 AES-GCM 마스터키 (설계서 6.2)
    # 없으면 기동에 실패한다. 암호화 없이 인증정보를 저장하는 상태로 뜨지 않게 하기 위함이다.
    # 생성 — openssl rand -base64 32
    master-key: ${PALIM_CRYPTO_MASTER_KEY}
  admin:
    # 계정이 없을 때만 사용된다. 이미 있으면 비밀번호를 덮어쓰지 않는다.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    kr.suhsaechan.palim: DEBUG
