spring:
  application:
    name: palim
  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 관리한다. 애플리케이션은 검증만 수행한다 (설계서 1장)
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # 전 계층 Instant / timestamptz 사용 (설계서 4.3)
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

  messages:
    # 에러 메시지는 errors.properties(한국어) / errors_en.properties(영문) 두 파일에 모은다.
    # 새 ErrorCode 를 추가하면 두 파일에 한 줄씩 더하면 되고, 이 설정은 손대지 않는다.
    basename: errors
    encoding: UTF-8
    # 키가 없으면 예외 대신 키를 반환한다. 누락은 ErrorCodeIntegrationTest 가 잡는다.
    use-code-as-default-message: true
    # 반드시 false 여야 한다.
    #
    # MessageSource 는 "요청 로케일 → 시스템 로케일 → 기본 번들" 순으로 찾는다. 이 값이 true 면
    # ko 요청에 errors_ko.properties 가 없을 때 시스템 로케일로 넘어가는데, 서버 로케일이 en 이면
    # 한국어를 요청했는데 영문이 나간다. 즉 배포 환경의 OS 설정이 사용자에게 보이는 언어를 바꾼다.
    # false 로 두면 시스템 로케일을 건너뛰고 기본 번들(한국어)로 떨어진다.
    fallback-to-system-locale: false

palim:
  telegram:
    # 없으면 알림이 Outbox 에 쌓이기만 한다. 암호화 마스터키와 달리 기동을 막지 않는다 —
    # 발주자가 나중에 설정하는 항목이고, 대기 중 알림은 유실되지 않기 때문이다.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    api-base-url: https://api.telegram.org
    timeout: 10s
    max-attempts: 5

  notification:
    relay-delay: 30000

  collect:
    # 조회 구간 겹침 여유. 채널 API 는 주문 시각이 지연 반영되므로 구간을 정확히 이어붙이면
    # 경계에서 주문이 누락된다. 중복은 유니크 제약이 막지만 누락은 감지되지 않는다.
    overlap: 10m
    initial-lookback: 24h
    failure-threshold: 3
    scheduler-delay: 60000
    reconcile-delay: 300000

  crypto:
    # 채널 API 인증정보 AES-GCM 마스터키 (설계서 6.2)
    # 없으면 기동에 실패한다. 암호화 없이 인증정보를 저장하는 상태로 뜨지 않게 하기 위함이다.
    # 생성 — openssl rand -base64 32
    master-key: ${PALIM_CRYPTO_MASTER_KEY}
  admin:
    # 계정이 없을 때만 사용된다. 이미 있으면 비밀번호를 덮어쓰지 않는다.
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    kr.suhsaechan.palim: DEBUG
