# 루브릭 프리셋 — 캠페인 성격별 가중치 세트
#
# 가중치를 매번 감으로 조정하는 대신, 캠페인이 무엇을 사려는지에 따라 세트를 고른다.
# 화면에서 프리셋을 고른 뒤 개별 항목을 미세 조정하고, 저장하면 새 루브릭 버전이 만들어진다.
# 각 프리셋의 룰 배점 합은 항상 70 이다(AI 30 과 합쳐 100).
#
# 프리셋 선택 기준을 한 줄로:
#   당장 매출을 뽑아야 한다        → efficiency
#   브랜드가 크고 사고가 나면 안 된다 → safety
#   예산이 적고 선점하고 싶다       → discovery
palim:
  influencer:
    rubric-presets:

      # ── 기본값. 도달 효율과 안정성의 균형 ──────────────────────────
      - code: balanced
        name: 균형형 (기본)
        description: >
          특정 목적이 뚜렷하지 않을 때. 조회수 계열 42/70 으로 단가 대비 도달을 중시하되
          참여율·안정성도 균형 있게 본다. 처음 시작하는 캠페인의 출발점.
        rule:
          reach: 14.0
          vsr: 14.0
          momentum: 14.0        # trend 6 + peak 5 + crash 3
          engagement: 12.0
          activity: 8.0         # uploads 5 + recency 3
          stability: 8.0
        ai:
          brand-safety: 12.0
          campaign-fit: 10.0
          audience-quality: 8.0

      # ── 당장 매출. 싸게 많이 도달 ──────────────────────────────────
      - code: efficiency
        name: 가성비 우선
        description: >
          한정된 예산으로 최대 도달을 사야 할 때. 도달 효율(VSR)과 실도달량을 최대로 올리고
          브랜드 안전성 비중은 낮춘다. 대신 CPV 효율순 정렬을 기본으로 쓴다.
          제품이 저관여 소비재이고 사고 리스크가 낮을 때 적합하다.
        rule:
          reach: 18.0
          vsr: 20.0
          momentum: 12.0
          engagement: 10.0
          activity: 5.0
          stability: 5.0
        ai:
          brand-safety: 8.0
          campaign-fit: 12.0
          audience-quality: 10.0

      # ── 사고가 나면 안 되는 캠페인 ────────────────────────────────
      - code: safety
        name: 브랜드 안전 우선
        description: >
          브랜드 이미지 손상 비용이 광고비보다 큰 경우. 안정성과 활동성을 크게 보고
          AI 브랜드 안전성 배점을 최대로 올린다. 급락·논란 신호가 하나라도 있으면
          상위에 올라오지 못하게 하는 구성. 금융·의료·아동 대상 제품에 쓴다.
        rule:
          reach: 12.0
          vsr: 10.0
          momentum: 12.0
          engagement: 12.0
          activity: 12.0
          stability: 12.0
        ai:
          brand-safety: 16.0
          campaign-fit: 8.0
          audience-quality: 6.0

      # ── 뜨기 전에 싸게 선점 ──────────────────────────────────────
      - code: discovery
        name: 신규 발굴 우선
        description: >
          단가가 오르기 전의 채널을 잡는 구성. 모멘텀을 최대로 올리고 안정성 비중을 줄인다
          (성장 중인 채널은 원래 조회수 편차가 크다). 라이징 레이더와 함께 쓰며,
          실패 확률은 높지만 성공 시 단가 대비 성과가 압도적인 구간을 노린다.
        rule:
          reach: 8.0
          vsr: 16.0
          momentum: 24.0
          engagement: 12.0
          activity: 6.0
          stability: 4.0
        ai:
          brand-safety: 10.0
          campaign-fit: 10.0
          audience-quality: 10.0
