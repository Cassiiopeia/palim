# 자체 카테고리 체계 · 발굴 시드 키워드 · 단가 계수 초기값
#
# 이 파일은 "발주사와 합의하기 전의 출발점"이다. 확정본이 아니다 —
# 카테고리 목록과 키워드는 합의 후 DB 로 이관되어 화면에서 편집된다(설정 화면).
#
# 단가 계수(coefficient)는 구독자 1명당 추정 광고 단가(원)다. 업계 관행 추정치이며
# 실제 견적이 입력되기 시작하면(influencer_score.quoted_price) 그 실측값으로 대체한다.
# 계수가 높은 카테고리는 구매 전환이 직접적이라 단가가 비싼 분야다.
palim:
  influencer:
    taxonomy:
      categories:

        - code: beauty
          name: 뷰티
          coefficient: 45.0       # 전환 직결 + 광고 수요 최상위 → 단가 최고군
          seed-keywords:
            [쿠션 추천, 파운데이션 리뷰, 아이섀도우 팔레트, 립 제품 발색, 스킨케어 루틴,
             여드름 피부 관리, 데일리 메이크업, 헤어 스타일링, 향수 추천, 뷰티 하울]

        - code: parenting
          name: 육아
          coefficient: 40.0       # 구매 결정권자 밀집 + 신뢰 기반 → 단가 높음
          seed-keywords:
            [육아 브이로그, 신생아 용품, 이유식 만들기, 아기 장난감 추천, 유아 교육,
             출산 준비물, 아기 옷 추천, 육아템 리뷰, 어린이집 준비, 워킹맘 일상]

        - code: food
          name: 푸드·요리
          coefficient: 30.0
          seed-keywords:
            [자취 요리, 간단 레시피, 밀키트 리뷰, 에어프라이어 요리, 편의점 신상,
             집밥 브이로그, 베이킹 초보, 다이어트 식단, 자취 요리 추천, 야식 추천]

        - code: living
          name: 리빙·인테리어
          coefficient: 35.0
          seed-keywords:
            [자취방 인테리어, 원룸 꾸미기, 살림템 추천, 청소 꿀팁, 수납 정리,
             주방용품 리뷰, 홈카페 인테리어, 이사 준비, 가전 추천, 셀프 인테리어]

        - code: fashion
          name: 패션
          coefficient: 38.0
          seed-keywords:
            [데일리룩, 코디 추천, 옷 하울, 신발 리뷰, 가방 추천,
             체형 커버 코디, 계절 아우터, 액세서리 추천, 남자 코디, 쇼핑몰 후기]

        - code: pet
          name: 반려동물
          coefficient: 35.0
          seed-keywords:
            [강아지 브이로그, 고양이 일상, 반려동물 사료 추천, 애견 용품 리뷰,
             강아지 훈련, 고양이 장난감, 반려견 산책, 펫 미용, 동물병원 후기, 냥집사 일상]

        - code: fitness
          name: 운동·헬스
          coefficient: 32.0
          seed-keywords:
            [홈트레이닝, 다이어트 운동, 헬스 초보 루틴, 스트레칭, 필라테스,
             단백질 보충제 리뷰, 러닝 브이로그, 체지방 감량, 운동복 추천, 요가 루틴]

        - code: camping
          name: 캠핑·아웃도어
          coefficient: 33.0
          seed-keywords:
            [캠핑 브이로그, 캠핑 장비 추천, 차박, 백패킹, 텐트 리뷰,
             캠핑 요리, 등산 코스, 낚시 초보, 캠핑 의자 추천, 감성 캠핑]

        - code: tech
          name: 테크·IT
          coefficient: 28.0
          seed-keywords:
            [스마트폰 리뷰, 노트북 추천, 이어폰 비교, 스마트워치, 모니터 추천,
             키보드 리뷰, 가성비 전자기기, 앱 추천, 카메라 리뷰, 태블릿 활용]

        - code: travel
          name: 여행
          coefficient: 30.0
          seed-keywords:
            [국내 여행 추천, 해외 여행 브이로그, 숙소 리뷰, 항공권 꿀팁,
             혼자 여행, 당일치기 여행, 호캉스, 맛집 투어, 여행 준비물, 캠핑카 여행]

        - code: finance
          name: 재테크·금융
          coefficient: 42.0       # 금융 광고 단가가 원래 높다
          seed-keywords:
            [주식 초보, 재테크 방법, 적금 추천, 부동산 초보, 절세 방법,
             연금 준비, 신용카드 혜택, 가계부 정리, 투자 공부, 파이어족]

        - code: selfdev
          name: 자기계발·교육
          coefficient: 30.0
          seed-keywords:
            [공부 자극, 시간 관리, 독서 리뷰, 자격증 공부, 영어 공부 방법,
             생산성 앱, 노션 활용, 취업 준비, 이직 준비, 습관 만들기]

        - code: game
          name: 게임
          coefficient: 22.0       # 도달은 크지만 구매 전환이 간접적
          seed-keywords:
            [게임 공략, 신작 게임 리뷰, 모바일 게임 추천, 게임 실황,
             인디 게임, 게임 장비 추천, e스포츠 분석, 스팀 게임 추천, 게임 랭킹, 게임 뉴스]

        - code: car
          name: 자동차
          coefficient: 35.0
          seed-keywords:
            [신차 리뷰, 중고차 구매 팁, 자동차 용품, 차량 관리, 전기차 리뷰,
             주행 영상, 세차 방법, 자동차 보험, 카시트 추천, 드라이브 코스]

        - code: kids
          name: 키즈
          coefficient: 25.0       # 시청자와 구매자가 달라 전환 경로가 길다
          seed-keywords:
            [키즈 콘텐츠, 어린이 장난감, 동요, 놀이 영상, 어린이 실험,
             키즈 카페, 색칠놀이, 어린이 만들기, 학습 놀이, 유아 영어]
