# 에러 메시지 (한국어 · 기본)
#
# 키는 error.{ErrorCode enum 이름} 이다. 인자는 MessageFormat 규칙을 따른다 — {0}, {1}
# 새 ErrorCode 를 추가하면 이 파일과 errors_en.properties 에 한 줄씩 더한다.
# 누락은 ErrorCodeIntegrationTest 가 빌드 시점에 잡는다.

# ===== 공통 (C) =====
error.INTERNAL_ERROR=처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.
error.INVALID_INPUT=입력값이 올바르지 않습니다: {0}
error.VALIDATION_FAILED=입력값 검증에 실패했습니다.
error.UNAUTHORIZED=로그인이 필요합니다.
error.ACCESS_DENIED=접근 권한이 없습니다.
error.TRANSACTION_REQUIRED=트랜잭션이 필요한 작업입니다. 호출 경로를 확인해야 합니다.

# ===== SKU · 재고 (S) =====
error.SKU_NOT_FOUND=SKU를 찾을 수 없습니다: {0}
error.SKU_CODE_DUPLICATE=이미 등록된 SKU 코드입니다: {0}
error.INSUFFICIENT_STOCK=재고가 부족합니다. SKU {0}, 현재 {1}개, 요청 {2}개
error.INVALID_STOCK_AMOUNT=재고 변동 수량은 1 이상이어야 합니다: {0}
error.INVALID_SAFETY_THRESHOLD=안전재고 임계치는 0 이상이어야 합니다: {0}

