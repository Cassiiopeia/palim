error.ORDER_LINE_DUPLICATE=이미 수집된 주문 항목입니다. 채널 {0}, 주문번호 {1}, 항목번호 {2}
error.INVALID_ORDER_QUANTITY=주문 수량은 1 이상이어야 합니다: {0}
error.ORDER_SKU_ID_REQUIRED=연결할 SKU 식별자가 필요합니다.

