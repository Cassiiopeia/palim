# 공통 에러 메시지 (한국어 · 기본)
#
# 키는 error.{ErrorCode enum 이름} 이다.
# 인자는 MessageFormat 규칙을 따른다 — {0}, {1}
#
# 주의: 여기에 도메인 메시지를 넣지 않는다. 각 도메인 모듈이 errors/{도메인}.properties 를 갖는다.

error.INTERNAL_ERROR=처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.
error.INVALID_INPUT=입력값이 올바르지 않습니다: {0}
error.VALIDATION_FAILED=입력값 검증에 실패했습니다.
error.UNAUTHORIZED=로그인이 필요합니다.
error.ACCESS_DENIED=접근 권한이 없습니다.
error.TRANSACTION_REQUIRED=트랜잭션이 필요한 작업입니다. 호출 경로를 확인해야 합니다.
