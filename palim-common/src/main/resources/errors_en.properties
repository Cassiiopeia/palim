# Error messages (English)
#
# Keys follow error.{ErrorCode enum name}. Arguments use MessageFormat syntax — {0}, {1}

# ===== Common (C) =====
error.INTERNAL_ERROR=An error occurred while processing the request. Please try again later.
error.INVALID_INPUT=Invalid input: {0}
error.VALIDATION_FAILED=Input validation failed.
error.UNAUTHORIZED=Authentication is required.
error.ACCESS_DENIED=You do not have permission to access this resource.
error.TRANSACTION_REQUIRED=This operation requires a transaction. Check the call path.

# ===== SKU / inventory (S) =====
error.SKU_NOT_FOUND=SKU not found: {0}
error.SKU_CODE_DUPLICATE=SKU code already exists: {0}
error.INSUFFICIENT_STOCK=Insufficient stock. SKU {0}, current {1}, requested {2}
error.INVALID_STOCK_AMOUNT=Stock change amount must be at least 1: {0}
error.INVALID_SAFETY_THRESHOLD=Safety threshold must be 0 or greater: {0}

# ===== Order (O) =====
error.ORDER_NOT_FOUND=Order not found: {0}
error.ORDER_LINE_NOT_FOUND=Order line not found: {0}
error.ORDER_LINE_DUPLICATE=Order line already collected. channel {0}, order {1}, line {2}
error.INVALID_ORDER_QUANTITY=Order quantity must be at least 1: {0}
error.ORDER_SKU_ID_REQUIRED=A SKU identifier is required.

# ===== Product mapping (M) =====
error.PRODUCT_MAPPING_NOT_FOUND=Product mapping not found: {0}
error.PRODUCT_MAPPING_DUPLICATE=Product mapping already exists: {0}
error.MAPPING_SKU_ID_REQUIRED=A SKU identifier is required.

# ===== Channel (H) =====
error.CHANNEL_NOT_FOUND=Channel not found: {0}
error.CHANNEL_CREDENTIAL_NOT_FOUND=Channel credential not found. channel {0}, key {1}
error.CREDENTIAL_ENCRYPT_FAILED=Failed to encrypt the credential.
error.CREDENTIAL_DECRYPT_FAILED=Failed to decrypt the credential. The master key may have changed or the stored value is corrupted.
error.STOCK_PUSH_SETTING_NOT_INITIALIZED=Stock push settings are not initialized. Check the startup bootstrap.
error.INVALID_COLLECT_INTERVAL=Collect interval must be at least 1 second: {0}
error.INVALID_MAX_DELTA=Max delta per push must be at least 1: {0}
error.CHANNEL_API_FAILED=Channel API call failed. channel {0}
error.CHANNEL_ADAPTER_NOT_AVAILABLE=Integration for this channel is not available yet: {0}

# ===== Notification (N) =====
error.NOTIFICATION_NOT_FOUND=Notification not found: {0}
error.NOTIFICATION_SETTING_NOT_INITIALIZED=Notification settings are not initialized. Check the startup bootstrap.
error.PAYLOAD_SERIALIZE_FAILED=Failed to serialize the notification payload.
error.PAYLOAD_DESERIALIZE_FAILED=Failed to parse the notification payload: {0}
error.INVALID_BATCH_INTERVAL=Batch interval must be at least 1 minute: {0}
error.INVALID_QUIET_HOURS=Quiet hours require both a start and an end time.
error.INVALID_REPEAT_HOURS=Repeat interval must be at least 1 hour: {0}
error.TELEGRAM_SEND_FAILED=Failed to send the Telegram message.

# ===== Auth (A) =====
error.ADMIN_ACCOUNT_NOT_FOUND=Admin account not found: {0}
error.INVALID_USERNAME=Username must not be blank.
error.INVALID_PASSWORD=Password must not be blank.
error.ADMIN_PASSWORD_REQUIRED=Admin account {0} does not exist and no initial password was provided. Set the ADMIN_PASSWORD environment variable and restart.
error.PASSWORD_TOO_SHORT=Password must be at least {0} characters.
error.PASSWORD_CONTAINS_USERNAME=Password must not contain the username.
error.PASSWORD_REPEATED_CHARS=Password must not repeat the same character {0} or more times in a row.
error.PASSWORD_MISMATCH=Current password does not match.
error.NOTIFICATION_NOT_RETRYABLE=Only failed notifications can be resent. (current status: {0})
