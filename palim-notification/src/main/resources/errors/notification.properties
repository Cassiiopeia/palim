# 알림 도메인 에러 메시지 (한국어 · 기본)

error.NOTIFICATION_NOT_FOUND=알림을 찾을 수 없습니다: {0}
error.NOTIFICATION_SETTING_NOT_INITIALIZED=알림 설정이 초기화되지 않았습니다. 기동 초기화를 확인해야 합니다.
error.PAYLOAD_SERIALIZE_FAILED=알림 내용을 저장 형식으로 변환하지 못했습니다.
error.PAYLOAD_DESERIALIZE_FAILED=알림 내용을 해석하지 못했습니다: {0}
error.INVALID_BATCH_INTERVAL=묶음 발송 주기는 1분 이상이어야 합니다: {0}
error.INVALID_QUIET_HOURS=야간 발송 시간대는 시작과 끝을 함께 지정해야 합니다.
error.INVALID_REPEAT_HOURS=재알림 주기는 1시간 이상이어야 합니다: {0}
error.TELEGRAM_SEND_FAILED=텔레그램 발송에 실패했습니다.
