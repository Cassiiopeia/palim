<!DOCTYPE html>
<!--/*
  연동 커넥터 목록.

  목록을 훑을 때 문제가 먼저 보여야 한다 — 실패한 실행과 확정되지 않은 매핑을 뱃지로 구분한다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">

    <div class="flex justify-between items-center mb-4">
        <p class="text-sm text-base-content/70">
            외부 시스템 데이터를 표준 모델로 들이는 연동 정의입니다.
            새 원천이 붙어도 배포 없이 여기서 추가합니다.
        </p>
        <a th:href="@{/connectors/new}" class="btn btn-primary btn-sm">새 연동 만들기</a>
    </div>

    <div th:if="${connectors.isEmpty()}" class="card bg-base-100 shadow-sm">
        <div class="card-body items-center text-center py-12">
            <h2 class="card-title">아직 연동이 없습니다</h2>
            <p class="text-base-content/70">
                엑셀·CSV 파일이나 API 를 표준 모델에 연결하면 대사·리포트에 바로 쓸 수 있습니다.
            </p>
            <a th:href="@{/connectors/new}" class="btn btn-primary mt-2">첫 연동 만들기</a>
        </div>
    </div>

    <div th:unless="${connectors.isEmpty()}" class="card bg-base-100 shadow-sm">
        <div class="card-body p-0">
            <div class="overflow-x-auto">
                <table class="table">
                    <thead>
                    <tr>
                        <th>이름</th>
                        <th>목표 모델</th>
                        <th>원천</th>
                        <th>매핑</th>
                        <th>마지막 실행</th>
                        <th class="text-right">동작</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${connectors}">
                        <td>
                            <div class="font-medium" th:text="${c.name}">이름</div>
                            <div class="text-xs text-base-content/60" th:text="${c.code}">코드</div>
                        </td>
                        <td th:text="${c.targetModelName}">모델</td>
                        <td>
                            <span class="badge badge-ghost badge-sm" th:text="${c.sourceType}">UPLOAD</span>
                        </td>
                        <td>
                            <span th:if="${c.readyForLive}" class="badge badge-success badge-sm"
                                  th:text="|v${c.activeVersion} 확정|">확정</span>
                            <span th:unless="${c.readyForLive}" class="badge badge-warning badge-sm">
                                미확정 · 테스트만
                            </span>
                        </td>
                        <td>
                            <span th:if="${c.lastStatus == null}" class="text-base-content/50">
                                실행 없음
                            </span>
                            <div th:unless="${c.lastStatus == null}">
                                <span class="badge badge-sm"
                                      th:classappend="${c.hasFailure} ? 'badge-error' : 'badge-success'"
                                      th:text="${c.lastStatus}">상태</span>
                                <div class="text-xs text-base-content/60"
                                     th:text="|성공 ${c.lastSuccess} · 실패 ${c.lastFailed}|">건수</div>
                            </div>
                        </td>
                        <td class="text-right whitespace-nowrap">
                            <a class="btn btn-ghost btn-xs"
                               th:href="@{/connectors/{id}/mapping(id=${c.id})}">매핑</a>
                            <a class="btn btn-ghost btn-xs"
                               th:href="@{/connectors/{id}/runs(id=${c.id})}">이력</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
