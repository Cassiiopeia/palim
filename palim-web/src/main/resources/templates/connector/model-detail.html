<!DOCTYPE html>
<!--/* 목표 모델 필드. 매핑 편집기의 오른쪽에 그려지는 목록이다. */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">

    <div class="flex gap-2 mb-4">
        <a th:href="@{/connectors/models}" class="btn btn-ghost btn-sm">← 목표 모델</a>
    </div>

    <div class="card bg-base-100 shadow-sm mb-4">
        <div class="card-body p-0">
            <div class="p-4 pb-0">
                <h2 class="card-title text-base" th:text="${model.name}">이름</h2>
                <p class="text-sm text-base-content/70">
                    중복 판정 기준:
                    <code class="text-xs"
                          th:text="${#strings.listJoin(model.naturalKeyFields, ', ')}">키</code>
                </p>
            </div>
            <div class="overflow-x-auto">
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th>표시명</th>
                        <th>키</th>
                        <th>타입</th>
                        <th>필수</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="f : ${fields}">
                        <td th:text="${f.displayName}">표시명</td>
                        <td><code class="text-xs" th:text="${f.fieldKey}">key</code></td>
                        <td>
                            <span class="badge badge-ghost badge-sm" th:text="${f.dataType}">STRING</span>
                        </td>
                        <td>
                            <span th:if="${f.required}" class="badge badge-error badge-sm">필수</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!--/* 기본 제공 모델의 필드는 코드가 관리한다. 커스텀만 화면에서 추가한다. */-->
    <div th:if="${model.isCustom()}" class="card bg-base-100 shadow-sm">
        <div class="card-body">
            <h2 class="card-title text-base">필드 추가</h2>
            <form th:action="@{/connectors/models/{id}/fields(id=${model.id})}" method="post"
                  class="flex flex-wrap gap-3 items-end mt-2">
                <label class="form-control">
                    <div class="label py-1"><span class="label-text text-xs">표시명</span></div>
                    <input type="text" name="displayName" required
                           class="input input-bordered input-sm w-40">
                </label>
                <label class="form-control">
                    <div class="label py-1"><span class="label-text text-xs">키</span></div>
                    <input type="text" name="fieldKey" required pattern="[a-z0-9_]+"
                           class="input input-bordered input-sm w-40">
                </label>
                <label class="form-control">
                    <div class="label py-1"><span class="label-text text-xs">타입</span></div>
                    <select name="dataType" class="select select-bordered select-sm">
                        <option th:each="t : ${dataTypes}" th:value="${t}" th:text="${t}">STRING</option>
                    </select>
                </label>
                <label class="label cursor-pointer gap-2">
                    <input type="checkbox" name="required" value="true" class="checkbox checkbox-sm">
                    <span class="label-text text-xs">필수</span>
                </label>
                <button type="submit" class="btn btn-primary btn-sm">추가</button>
            </form>
        </div>
    </div>

    <div th:unless="${model.isCustom()}" class="alert">
        <span class="text-sm">
            기본 제공 모델의 필드는 코드가 관리합니다. 표시명·순서를 바꾸면 배포가 되돌리지 않지만,
            새 필드는 마이그레이션과 함께 추가해야 실제 컬럼이 생깁니다.
        </span>
    </div>

</div>
</body>
</html>
