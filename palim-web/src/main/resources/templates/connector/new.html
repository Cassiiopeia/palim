<!DOCTYPE html>
<!--/* 연동 만들기. 이름·목표 모델·원천 유형만 정하고 매핑은 다음 화면에서 한다. */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">

    <form th:action="@{/connectors}" method="post" class="card bg-base-100 shadow-sm max-w-2xl">
        <div class="card-body gap-4">

            <label class="form-control">
                <div class="label"><span class="label-text">이름</span></div>
                <input type="text" name="name" required class="input input-bordered"
                       placeholder="예: 전산재고 일일 스냅샷">
                <div class="label">
                    <span class="label-text-alt text-base-content/60">목록에 표시되는 이름입니다.</span>
                </div>
            </label>

            <label class="form-control">
                <div class="label"><span class="label-text">코드</span></div>
                <input type="text" name="code" required class="input input-bordered"
                       pattern="[a-z0-9\-_]+" placeholder="erp-stock-daily">
                <div class="label">
                    <span class="label-text-alt text-base-content/60">
                        영문 소문자·숫자·하이픈. 만든 뒤에는 바꾸지 않습니다.
                    </span>
                </div>
            </label>

            <label class="form-control">
                <div class="label"><span class="label-text">목표 모델</span></div>
                <select name="targetModelId" required class="select select-bordered">
                    <option th:each="m : ${targetModels}" th:value="${m.id}"
                            th:text="|${m.name} (${m.code})|">모델</option>
                </select>
                <div class="label">
                    <span class="label-text-alt text-base-content/60">
                        데이터를 어디에 담을지 정합니다. 기본 제공 모델 위에는 대사·리포트가 이미 붙어 있습니다.
                    </span>
                </div>
            </label>

            <label class="form-control">
                <div class="label"><span class="label-text">원천 유형</span></div>
                <select name="sourceType" required class="select select-bordered">
                    <option th:each="t : ${sourceTypes}" th:value="${t}" th:text="${t}">UPLOAD</option>
                </select>
                <div class="label">
                    <span class="label-text-alt text-base-content/60">
                        API 가 막히는 날이 반드시 오므로 업로드 경로는 항상 열어 둡니다.
                    </span>
                </div>
            </label>

            <label class="form-control">
                <div class="label"><span class="label-text">기준 단위</span></div>
                <input type="text" name="defaultUnit" value="EA" class="input input-bordered w-32">
                <div class="label">
                    <span class="label-text-alt text-base-content/60">
                        원천에 단위 컬럼이 없을 때 쓰는 값입니다. 대사·집계는 이 단위로 환산된 수량만 씁니다.
                    </span>
                </div>
            </label>

            <div class="card-actions justify-end mt-2">
                <a th:href="@{/connectors}" class="btn btn-ghost">취소</a>
                <button type="submit" class="btn btn-primary">만들기</button>
            </div>
        </div>
    </form>

</div>
</body>
</html>
