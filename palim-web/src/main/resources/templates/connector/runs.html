<!DOCTYPE html>
<!--/*
  실행 이력.

  사용한 매핑 버전을 함께 보여준다 — "지난달 데이터가 왜 이런가"에 답하려면 그때 어떤 정의로
  돌았는지가 필요하다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">

    <!--/* 흐름 화면에는 rail 을 끝까지 둔다. 여기서 사라지면 사용자가 몇 단계째인지 잃는다. */-->
    <ul class="steps steps-horizontal w-full mb-6 text-sm">
        <li class="step step-primary">시스템 연결</li>
        <li class="step step-primary">칸 연결</li>
        <li class="step" th:classappend="${!runs.isEmpty()} ? 'step-primary'">시험 실행</li>
        <li class="step">매일 자동</li>
    </ul>

    <!--/* 같은 목적지로 가는 링크는 화면이 달라도 같은 이름을 쓴다 — 「칸 연결」. */-->
    <div class="flex gap-2 mb-4">
        <a th:href="@{/connectors}" class="btn btn-ghost btn-sm">← 목록</a>
        <a th:href="@{/connectors/{id}/mapping(id=${connector.id})}" class="btn btn-ghost btn-sm">
            칸 연결
        </a>
    </div>

    <div th:if="${runs.isEmpty()}" class="card bg-base-100 shadow-sm">
        <div class="card-body items-center text-center py-12">
            <p class="text-base-content/70">아직 실행 기록이 없습니다.</p>
            <a th:href="@{/connectors/{id}/mapping(id=${connector.id})}"
               class="btn btn-primary btn-sm mt-2">
                칸 연결
            </a>
        </div>
    </div>

    <div th:unless="${runs.isEmpty()}" class="card bg-base-100 shadow-sm">
        <div class="card-body p-0">
            <div class="overflow-x-auto">
                <table class="table table-sm">
                    <thead>
                    <tr class="text-xs">
                        <th>시작</th>
                        <th>모드</th>
                        <th>매핑</th>
                        <th>결과</th>
                        <th>건수</th>
                        <th>소요</th>
                        <th class="text-right">동작</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r, it : ${runs}">
                        <!--/* ISO-8601 원문을 그대로 뿌리지 않는다. 포맷터는 null 을 받으면
                               터지므로 없을 때를 따로 그린다. */-->
                        <td class="whitespace-nowrap text-xs">
                            <span th:if="${r.startedAt != null}"
                                  th:text="${#temporals.format(r.startedAt, 'MM-dd HH:mm')}">시각</span>
                            <span th:if="${r.startedAt == null}" class="text-base-content/40">—</span>
                        </td>
                        <!--/* 모드는 상태가 아니라 분류다 — 색을 쓰지 않는다. */-->
                        <td>
                            <span class="badge badge-sm badge-ghost"
                                  th:text="${r.isTest()} ? '테스트' : '적재'">모드</span>
                        </td>
                        <td class="text-xs" th:text="|v${r.mappingVersion}|">v1</td>
                        <!--/* 잘 끝난 실행에는 색을 켜지 않는다. 모든 행이 초록이면 한 줄 고장난
                               표가 다 정상인 표와 똑같이 시끄러워진다. */-->
                        <td>
                            <span class="badge badge-sm"
                                  th:classappend="${r.status == 'PARTIAL'} ? 'badge-warning'
                                                : (${r.status == 'FAILED'} ? 'badge-error' : 'badge-ghost')"
                                  th:text="${r.status == 'SUCCEEDED'} ? '성공'
                                         : (${r.status == 'PARTIAL'} ? '일부 실패'
                                         : (${r.status == 'ROLLED_BACK'} ? '되돌림'
                                         : (${r.status == 'RUNNING'} ? '실행 중' : '실패')))">상태</span>
                            <div th:if="${r.errorSummary != null}"
                                 class="text-xs text-error mt-1" th:text="${r.errorSummary}">사유</div>
                        </td>
                        <td class="text-xs">
                            <span th:text="|${r.successCount} / ${r.totalCount}|">0/0</span>
                            <span th:if="${r.failedCount > 0}" class="text-error"
                                  th:text="|(실패 ${r.failedCount})|">실패</span>
                        </td>
                        <td class="text-xs">
                            <span th:if="${r.elapsedSeconds() != null}"
                                  th:text="|${r.elapsedSeconds()}초|">0초</span>
                            <!--/* 빈 칸은 «값이 없다» 인지 «아직 안 그렸다» 인지 구분되지 않는다. */-->
                            <span th:if="${r.elapsedSeconds() == null}"
                                  class="text-base-content/40">—</span>
                        </td>
                        <td class="text-right whitespace-nowrap">
                            <a class="btn btn-ghost btn-sm"
                               th:href="@{/connectors/{id}/runs/{runId}(id=${connector.id},runId=${r.id})}">
                                상세
                            </a>
                            <!--/*
                              되돌리기는 가장 최근 실행에만 연다. 그 이전까지 거슬러 오르면 이후
                              실행들과 뒤엉켜 어떤 상태로 돌아가는지 설명할 수 없다.
                            */-->
                            <form th:if="${it.index == 0 and !r.rolledBack()}"
                                  th:action="@{/connectors/{id}/runs/{runId}/rollback(id=${connector.id},runId=${r.id})}"
                                  method="post" class="inline">
                                <button type="submit" class="btn btn-ghost btn-sm text-error">
                                    되돌리기
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
