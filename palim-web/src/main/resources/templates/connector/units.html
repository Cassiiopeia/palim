<!DOCTYPE html>
<!--/*
  단위 환산 규칙.

  적재가 단위 때문에 막혔을 때 푸는 화면이다. 막는 장치(UNIT_CONVERSION_NOT_FOUND)를 만들었으면
  푸는 수단도 같이 줘야 한다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">

    <div class="alert alert-info mb-4">
        <div>
            <p class="text-sm">
                원천이 <span class="font-medium">단위를 명시했는데</span> 환산 규칙이 없으면
                적재가 실패합니다. 조용히 1:1 로 넘기면 BOX 12개가 EA 12개로 둔갑하고,
                그 오류는 대사 결과가 이상해질 때까지 아무도 모르기 때문입니다.
            </p>
            <p class="text-sm mt-1">
                단위 컬럼이 <span class="font-medium">아예 없는</span> 원천은 규칙 없이도 정상 적재됩니다.
            </p>
        </div>
    </div>

    <div class="card bg-base-100 shadow-sm mb-4">
        <div class="card-body">
            <h2 class="card-title text-base">규칙 추가</h2>
            <form th:action="@{/connectors/units}" method="post"
                  class="flex flex-wrap gap-3 items-end mt-2">
                <label class="form-control">
                    <div class="label py-1"><span class="label-text text-xs">품목 (비우면 전역)</span></div>
                    <input type="text" name="itemRef" class="input input-bordered input-sm w-56"
                           placeholder="예: 제품A 227g (27.05.14)">
                </label>
                <label class="form-control">
                    <div class="label py-1"><span class="label-text text-xs">원천 단위</span></div>
                    <input type="text" name="fromUnit" required
                           class="input input-bordered input-sm w-24" placeholder="BOX">
                </label>
                <label class="form-control">
                    <div class="label py-1"><span class="label-text text-xs">기준 단위</span></div>
                    <input type="text" name="toUnit" required
                           class="input input-bordered input-sm w-24" placeholder="EA">
                </label>
                <label class="form-control">
                    <div class="label py-1"><span class="label-text text-xs">배율</span></div>
                    <input type="number" name="factor" step="0.000001" min="0.000001" required
                           class="input input-bordered input-sm w-32" placeholder="12">
                </label>
                <button type="submit" class="btn btn-primary btn-sm">추가</button>
            </form>
            <p class="text-xs text-base-content/60 mt-1">
                배율은 <span class="font-medium">원천 단위 1개가 기준 단위로 몇 개인가</span>입니다.
                BOX 1개가 EA 12개면 12 입니다.
            </p>
        </div>
    </div>

    <div th:if="${rules.isEmpty()}" class="card bg-base-100 shadow-sm">
        <div class="card-body items-center text-center py-10">
            <p class="text-base-content/70">등록된 규칙이 없습니다.</p>
            <p class="text-sm text-base-content/60">
                지금 연결된 원천들이 단위 컬럼을 쓰지 않는다면 규칙이 없어도 됩니다.
            </p>
        </div>
    </div>

    <div th:unless="${rules.isEmpty()}" class="card bg-base-100 shadow-sm">
        <div class="card-body p-0">
            <div class="overflow-x-auto">
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th>적용 범위</th>
                        <th>환산</th>
                        <th>배율</th>
                        <th class="text-right">동작</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${rules}">
                        <td>
                            <span th:if="${r.itemRef == null}" class="badge badge-ghost badge-sm">
                                전역
                            </span>
                            <span th:unless="${r.itemRef == null}" th:text="${r.itemRef}">품목</span>
                        </td>
                        <td>
                            <code class="text-xs" th:text="|${r.fromUnit} → ${r.toUnit}|">BOX → EA</code>
                        </td>
                        <td th:text="${r.factor}">12</td>
                        <td class="text-right">
                            <form th:action="@{/connectors/units/{id}/delete(id=${r.id})}"
                                  method="post" class="inline">
                                <button type="submit" class="btn btn-ghost btn-xs text-error">삭제</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
