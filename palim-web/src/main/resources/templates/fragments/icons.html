<!DOCTYPE html>
<!--/* 아이콘 모음.

       모양은 Lucide(ISC, https://lucide.dev) v1.31.0 의 path 를 그대로 옮겼다. 외부 CDN 이나
       아이콘 폰트를 쓰지 않는 이유는 CSP 가 default-src 'self' 라 바깥 요청이 막히기 때문이다 —
       인라인 SVG 만 확실히 뜬다(layout.html 의 햄버거도 같은 방식이다).

       세 가지는 아이콘마다 어기지 않는다.
       - class="size-4"        크기는 한 값. 아이콘마다 크기가 다르면 줄 높이가 흔들린다
       - stroke="currentColor" 색을 지정하지 않는다. 글자색·테마·선택 상태를 따라가야 한다.
                               아이콘은 상태를 말하지 않으므로 semantic 색을 쓸 일이 없다(C1)
       - aria-hidden="true"    옆에 항상 글자가 있다. 읽어주면 같은 말이 두 번 나온다

       bell-cog 만 Lucide 에 없어 직접 조합했다 — 자세한 것은 해당 fragment 주석. */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* 홈 */-->

</svg>

</svg>

<!--/* 품목 맞추기 — 둘을 «잇는다» */-->

<!--/* 알림 설정.

       Lucide 에 bell-cog 는 없다. 그래서 Lucide 도형 둘을 그대로 합쳤다 — 종은 bell-dot 의 것
       (오른쪽 위가 덧붙일 자리만큼 이미 비어 있다), 톱니는 monitor-cog 의 것(중심 18,6)이다.
       손으로 좌표를 다시 계산하지 않았으므로 다른 아이콘과 선 굵기·격자·모서리가 저절로 맞는다. */-->
