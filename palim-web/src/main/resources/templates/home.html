<!DOCTYPE html>
<!--/* 홈.

       같은 자리가 시간에 따라 다른 것을 보여준다. 준비가 안 끝났으면 «다음 한 걸음» 하나만,
       끝났으면 «오늘 결과». 여러 개를 나열하면 무엇부터 할지 다시 고민하게 된다.

       매일 여는 화면이라 «다 정상일 때 조용한 것» 이 이 화면의 요구사항이다. 정상까지 색이면
       문제가 생긴 날의 화면이 어제와 똑같아 보인다. */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">

    <!--/* 맞춰 본 적이 있으면 그것이 먼저다. 매일 여는 화면이 되어야 하기 때문이다. */-->
    <div th:if="${today.ran}" class="card bg-base-100 shadow-sm mb-6">
        <div class="card-body">
            <div class="flex items-center justify-between flex-wrap gap-2">
                <h2 class="card-title text-base">오늘 맞춰 봤습니다</h2>
                <span class="text-sm text-base-content/60"
                      th:text="${#temporals.format(today.at, 'MM-dd HH:mm')}">06:30</span>
            </div>

            <div class="flex flex-wrap gap-6 mt-2">
                <div>
                    <div class="text-sm text-base-content/60">지금 볼 것</div>
                    <!--/* 0 건이면 색을 끈다 — 손댈 것이 없는 날까지 색이면 색이 신호가 아니다.
                           «지금 볼 것» 은 대조가 깨진 것이 아니라 확인할 거리이므로 실패색이
                           아니라 warning 이고, 대조 결과 화면의 같은 숫자와도 색이 맞는다. */-->
                    <div class="text-xl font-semibold tabular-nums"
                         th:classappend="${today.needsAttention} ? 'text-warning' : 'text-base-content/40'"
                         th:text="${today.confirmed} + '건'">0건</div>
                </div>
                <div>
                    <div class="text-sm text-base-content/60">지켜볼 것</div>
                    <div class="text-xl font-semibold tabular-nums"
                         th:classappend="${today.observing > 0} ? '' : 'text-base-content/40'"
                         th:text="${today.observing} + '건'">0건</div>
                </div>
                <!--/* 미매칭은 «재고를 맞출 일» 이 아니라 «품목을 이을 일» 이라 따로 센다. */-->
                <div th:if="${today.unmatched > 0}">
                    <div class="text-sm text-base-content/60">아직 안 이어진 품목</div>
                    <div class="text-xl font-semibold tabular-nums"
                         th:text="${today.unmatched} + '건'">0건</div>
                </div>
            </div>

            <div class="card-actions justify-end">
                <a th:href="@{/reconcile}" class="btn btn-sm">대조 결과 보기</a>
                <a th:if="${today.unmatched > 0}" th:href="@{/reconcile/units}"
                   class="btn btn-sm btn-ghost">품목 맞추러 가기</a>
            </div>
        </div>
    </div>

    <!--/* 색 범례를 문장으로 적지 않는다. 이 문단은 아직 맞춰 본 적이 없을 때만 나오므로
           매일 오는 사람에게는 설명 없는 색만 남는다 — 설명해야 이해되는 색 체계라면
           문장을 늘릴 것이 아니라 색 쪽을 고쳐야 한다. */-->
    <p th:unless="${today.ran}" class="text-sm text-base-content/60 mb-6">
        전산 시스템과 물류 시스템의 재고를 매일 자동으로 맞춰 봅니다. 아래 순서대로 준비하면 됩니다.
    </p>

    <!--/* 끝난 체크리스트는 접는다.

           준비 단계는 언제나 4 개가 내려오므로, 조건 없이 그리면 다 끝낸 사람에게도 카드 4 장이
           매일 상단을 차지한다. 사라져야 할 체크리스트가 영구 가구가 되면 한 칸이 «확인 필요» 로
           바뀐 날에도 화면이 어제와 같아 보인다. 지워 버리지 않고 접어 두는 것은 준비 상태를
           다시 볼 길이 홈 말고는 없기 때문이다. */-->
    <th:block th:with="settled=${today.ran and #lists.isEmpty(steps.?[state.name() != 'DONE'])}">
        <details th:if="${settled}">
            <summary class="text-sm text-base-content/60 cursor-pointer">준비 단계 다시 보기</summary>
            <div class="mt-3">
                <div th:replace="~{fragments/setup-steps :: steps(${steps})}"></div>
            </div>
        </details>
        <th:block th:unless="${settled}">
            <div th:replace="~{fragments/setup-steps :: steps(${steps})}"></div>
        </th:block>
    </th:block>

</div>
</body>
</html>
