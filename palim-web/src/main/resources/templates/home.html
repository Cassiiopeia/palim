<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<th:block th:fragment="content">

    <div class="alert alert-info">
        <span>AI 업무자동화 대시보드는 준비 중입니다. 모듈이 추가되면 이곳에서 실행·이력을 봅니다.</span>
    </div>

    <div class="card bg-base-100 shadow-sm mt-6">
        <div class="card-body">
            <h2 class="card-title text-base">시작하기</h2>
            <ul class="steps steps-vertical">
                <li class="step step-primary">
                    <a th:href="@{/settings/notification}" class="link">텔레그램 연결</a>
                </li>
                <li class="step">첫 자동화 모듈 등록 (준비 중)</li>
                <li class="step">
                    <a th:href="@{/monitor/notifications}" class="link">알림 이력에서 발송 확인</a>
                </li>
            </ul>
        </div>
    </div>

</th:block>
</body>
</html>
