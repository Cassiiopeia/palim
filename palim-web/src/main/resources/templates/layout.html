<!DOCTYPE html>
<!--/*
  공통 레이아웃.

  daisyUI 컴포넌트만 쓴다. 커스텀 CSS 를 만들지 않는다(07-DECISIONS 009).
  drawer 로 사이드바를 구성해 모바일에서는 접히고 데스크톱에서는 고정된다 — F-09 가
  PC·모바일 모두 사용을 요구한다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|Palim · ${title}|">Palim</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!--/*
      세션 강제 종료 감시(SSE). 같은 계정으로 다른 곳에서 로그인하면 서버가 이벤트를 밀어주고,
      이 스크립트가 안내 후 로그인 화면으로 보낸다. 인라인 스크립트는 CSP 가 막으므로 파일이다.
    */-->
    <script th:src="@{/js/session-watch.js}" defer></script>
    <!--/* 화면 안에 박힌 스크립트는 보안 정책에 막혀 실행되지 않는다. 파일로만 둔다. */-->
    <script th:src="@{/js/auto-submit.js}" defer></script>
    <script th:src="@{/js/post-script.js}" defer></script>
</head>
<body class="min-h-screen bg-base-200">

<div class="drawer lg:drawer-open">
    <input id="sidebar-toggle" type="checkbox" class="drawer-toggle">

    <div class="drawer-content flex flex-col">
        <!-- 헤더 -->
        <div class="navbar bg-base-100 shadow-sm lg:hidden">
            <div class="flex-none">
                <label for="sidebar-toggle" class="btn btn-square btn-ghost" aria-label="메뉴 열기">
                    <!--/* 옆 label 에 aria-label 이 있다. 아이콘까지 읽으면 같은 말이 두 번 나온다. */-->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </label>
            </div>
            <div class="flex-1">
                <span class="text-lg font-semibold">Palim</span>
            </div>
        </div>

        <main class="flex-1 p-4 lg:p-8">
            <!--/*
              본문 최대 폭은 «여기서만» 정한다. 화면이 각자 max-w 를 들면 폼 화면만 좁고 표
              화면만 전폭이 되어, 넓은 모니터에서 화면을 옮길 때마다 글줄 시작점이 흔들린다.
            */-->
            <div class="mx-auto w-full max-w-7xl">
                <header class="mb-6">
                    <h1 class="text-2xl font-bold" th:text="${title}">제목</h1>
                    <!--/*
                      화면 부제 자리. 자리를 주지 않으면 각 화면이 부제를 만들려고 h1 을 또 그리거나
                      alert-info 로 파란 박스를 세운다 — 실제로 그렇게 됐다. 색 없는 한 줄이면 된다.
                    */-->
                    <p th:if="${subtitle}" class="text-sm text-base-content/60 mt-1"
                       th:text="${subtitle}"></p>
                </header>

                <!--/*
                  처리 결과 안내. 상태 변경 후 리다이렉트로 전달된다.
                  flash 는 «이 자리 하나» 다. 본문에서 같은 값을 다시 그리면 같은 색 박스가
                  세로로 두 개 겹친다.
                */-->
                <!--/* 방금 한 것을 «그 자리에서» 되돌릴 수 있어야 한다.
                       되돌리려고 다른 화면으로 가서 그 줄을 다시 찾아야 하면, 확신이 없을 때
                       사람은 아예 안 누른다 — 그러면 일이 안 끝난다(07-DECISIONS 043).
                       flashUndo 를 넣은 화면에서만 이 버튼이 뜬다. */-->
                <div th:if="${flashSuccess}" class="alert alert-success mb-4" role="status">
                    <span class="text-sm" th:text="${flashSuccess}"></span>
                    <form th:if="${flashUndo}" th:action="${flashUndo}" method="post"
                          class="ml-auto">
                        <button type="submit" class="btn btn-sm">되돌리기</button>
                    </form>
                    <a th:if="${flashLink}" th:href="${flashLink}" class="btn btn-sm"
                       th:text="${flashLinkLabel} ?: '보러 가기'">보러 가기</a>
                </div>
                <div th:if="${flashError}" class="alert alert-error mb-4" role="alert">
                    <span class="text-sm" th:text="${flashError}"></span>
                </div>

                <th:block th:replace="${content}"></th:block>
            </div>
        </main>
    </div>

    <!-- 사이드바 -->
    <div class="drawer-side z-10">
        <label for="sidebar-toggle" class="drawer-overlay" aria-label="메뉴 닫기"></label>
        <aside class="bg-base-100 min-h-full w-64 flex flex-col">
            <div class="p-4 border-b border-base-300">
                <a th:href="@{/}" class="text-xl font-bold">Palim</a>
                <p class="text-xs text-base-content/60 mt-1">AI 업무자동화</p>
            </div>

            <!--/*
              메뉴는 «여정 순서» 다. 「재고 맞추기」 세 항목이 사장님이 걷는 길 그대로이고,
              원천이 몇 개로 늘어나도 메뉴는 안 늘어난다 — 「재고 가져오는 곳」 안에서 행이 늘 뿐이다.

              「시작하기」를 빼고 홈이 그 일을 한다. 순서를 안내하는 화면이 메뉴의 한 항목이면
              여러 기능 중 하나로 보인다.

              동결 화면(재고·매핑·수집·인시던트·채널 설정)은 내비게이션에서 제거했다 — 07-DECISIONS 023.

              아이콘은 «자리 표시» 다. 항목마다 모양이 다르면 글자를 읽지 않고 위치로 찾게 된다.
              그래서 색을 주지 않는다(currentColor) — 색이 붙는 순간 아이콘이 상태를 말하는 것처럼
              보이고, 상태색이 뜻을 잃는다.
            */-->
            <ul class="menu p-2 flex-1">
                <li><a th:href="@{/}"><svg th:replace="~{fragments/icons :: house}"></svg>홈</a></li>
                <li><a th:href="@{/monitor/notifications}"><svg th:replace="~{fragments/icons :: bell}"></svg>알림 이력</a></li>

                <li class="menu-title">재고 맞추기</li>
                <li><a th:href="@{/connectors}"><svg th:replace="~{fragments/icons :: plug-zap}"></svg>재고 가져오는 곳</a></li>
                <li><a th:href="@{/reconcile/units}"><svg th:replace="~{fragments/icons :: link-2}"></svg>품목 맞추기</a></li>
                <li><a th:href="@{/reconcile}"><svg th:replace="~{fragments/icons :: scale}"></svg>대조 결과</a></li>

                <li class="menu-title">인플루언서</li>
                <li><a th:href="@{/influencer/grades}"><svg th:replace="~{fragments/icons :: award}"></svg>등급표</a></li>
                <li><a th:href="@{/influencer/rising}"><svg th:replace="~{fragments/icons :: trending-up}"></svg>라이징 레이더</a></li>
                <li><a th:href="@{/influencer/trends}"><svg th:replace="~{fragments/icons :: chart-line}"></svg>트렌드 보드</a></li>
                <li><a th:href="@{/influencer/campaigns}"><svg th:replace="~{fragments/icons :: megaphone}"></svg>캠페인 관리</a></li>

                <li class="menu-title">설정</li>
                <li><a th:href="@{/settings/notification}"><svg th:replace="~{fragments/icons :: bell-cog}"></svg>알림 설정</a></li>
                <li><a th:href="@{/settings/system}"><svg th:replace="~{fragments/icons :: settings}"></svg>시스템 설정</a></li>
                <li><a th:href="@{/settings/account}"><svg th:replace="~{fragments/icons :: user-round-cog}"></svg>계정 설정</a></li>
                <li>
                    <details>
                        <summary><svg th:replace="~{fragments/icons :: sliders}"></svg>고급</summary>
                        <ul>
                            <li><a th:href="@{/connectors/models}"><svg th:replace="~{fragments/icons :: table-2}"></svg>표준 표</a></li>
                            <li><a th:href="@{/audit}"><svg th:replace="~{fragments/icons :: scroll-text}"></svg>감사 로그</a></li>
                        </ul>
                    </details>
                </li>
            </ul>

            <div class="p-2 border-t border-base-300">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost btn-sm w-full justify-start">
                        로그아웃
                    </button>
                </form>
            </div>
        </aside>
    </div>
</div>

</body>
</html>
