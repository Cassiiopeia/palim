<!DOCTYPE html>
<!--/* 대조 정의 하나의 실행 이력. */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">

    <div th:if="${flashError}" class="alert alert-error mb-6">
        <span class="text-sm" th:text="${flashError}">오류</span>
    </div>

    <div class="flex flex-wrap items-start justify-between gap-3 mb-6">
        <div>
            <h1 class="text-2xl font-bold tracking-tight" th:text="${definition.name}">대조</h1>
            <p class="text-sm text-base-content/70 mt-0.5">
                <span th:text="${definition.leftSource}">좌</span>
                <span class="mx-1 opacity-50">↔</span>
                <span th:text="${definition.rightSource}">우</span>
            </p>
        </div>
        <div class="flex gap-2">
            <a th:href="@{/reconcile}" class="btn btn-ghost btn-sm">목록</a>
            <form th:action="@{/reconcile/{id}/run(id=${definition.id})}" method="post">
                <button type="submit" class="btn btn-primary btn-sm">지금 맞춰 보기</button>
            </form>
        </div>
    </div>

    <section>
        <div class="flex items-center gap-3 mb-2">
            <h2 class="text-base font-semibold">맞춰 본 기록</h2>
            <div class="flex-1 h-px bg-base-300"></div>
        </div>

        <div th:if="${#lists.isEmpty(runs)}" class="text-sm text-base-content/60 py-6">
            아직 맞춰 본 적이 없습니다.
        </div>

        <div class="overflow-x-auto" th:unless="${#lists.isEmpty(runs)}">
            <table class="table table-sm">
                <thead>
                <tr class="text-xs">
                    <th>기준 시각</th>
                    <th>결과</th>
                    <th class="text-right">차이</th>
                    <th class="text-right">안 이어진 품목</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${runs}">
                    <td class="font-mono text-xs" th:text="${r.baseAt}">시각</td>
                    <td>
                        <span th:if="${r.success}" class="badge badge-success badge-sm">맞춰 봄</span>
                        <span th:unless="${r.success}" class="badge badge-warning badge-sm">못 맞춤</span>
                        <div th:if="${r.message}" class="text-xs text-base-content/60 mt-0.5"
                             th:text="${r.message}">사유</div>
                    </td>
                    <td class="text-right font-mono text-xs tabular-nums"
                        th:text="${r.diffCount}">0</td>
                    <td class="text-right font-mono text-xs tabular-nums"
                        th:text="${r.unmatchedCount}">0</td>
                    <td class="text-right">
                        <a th:href="@{/reconcile/runs/{id}(id=${r.id})}"
                           class="btn btn-ghost btn-xs">결과 보기</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>
</body>
</html>
