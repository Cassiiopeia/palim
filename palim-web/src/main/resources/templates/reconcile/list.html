<!DOCTYPE html>
<!--/* 대조 목록. daisyUI 컴포넌트만 쓴다(07-DECISIONS 009). */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">

    <!--/* 제목과 flash 는 layout 이 그린다(11-UI-RULES T1·B1). */-->
    <p class="text-sm text-base-content/60 -mt-4 mb-6">
        두 시스템의 재고를 같은 기준으로 맞춰 보고, 시간 탓으로 설명되지 않는 차이만 남깁니다.
    </p>

    <!--/* 자료가 들어오는 곳이 둘이 안 되면 맞춰 볼 수가 없다. 그때는 정하라고 하지 않고
           무엇이 남았는지 말한다 — 할 수 없는 일을 시키면 사람은 화면을 오가다 포기한다. */-->
    <div th:if="${#lists.isEmpty(definitions) and #lists.size(connectors) < 2}"
         class="card bg-base-100 shadow-sm">
        <div class="card-body items-center text-center py-12">
            <p class="text-base-content/70">아직 맞춰 볼 것이 없습니다.</p>
            <p class="text-sm text-base-content/60">
                두 시스템에서 자료가 들어와야 서로 견줄 수 있습니다.
            </p>
            <a th:href="@{/connectors}" class="btn btn-primary btn-sm mt-2">시스템 연결하러 가기</a>
        </div>
    </div>

    <!--/* 무엇과 무엇을 맞춰 볼지 정하는 자리.

           이 경로가 없어서 대조가 영원히 돌지 않았다 — 시스템을 다 붙여도 아무 일이 일어나지
           않았다. 좌·우로 나눠 묻는 이유는 «어느 쪽이 많은지» 가 곧 무엇을 해야 하는지이기
           때문이다. 전산이 많으면 실물을 찾아봐야 하고, 실물이 많으면 전산에 안 잡힌 입고가 있다. */-->
    <div th:if="${#lists.size(connectors) >= 2}" class="card bg-base-100 shadow-sm mb-6">
        <div class="card-body">
            <h2 class="card-title text-base">맞춰 볼 대상 정하기</h2>
            <p class="text-sm text-base-content/60">
                두 시스템을 고르면 매일 아침 스스로 견줍니다. 품목을 묶어 둔 것만 셈에 들어갑니다.
            </p>

            <form method="post" th:action="@{/reconcile/definitions}" class="grid gap-4 mt-2">
                <div class="grid gap-4 md:grid-cols-2">
                    <label class="form-control">
                        <div class="label"><span class="label-text font-medium">전산 쪽</span></div>
                        <select name="leftSource" class="select select-bordered select-sm" required>
                            <option th:each="c : ${connectors}" th:value="${c.code}"
                                    th:text="${c.name}">시스템</option>
                        </select>
                        <div class="label">
                            <span class="label-text-alt text-base-content/60">장부상 수량</span>
                        </div>
                    </label>

                    <label class="form-control">
                        <div class="label"><span class="label-text font-medium">실물 쪽</span></div>
                        <select name="rightSource" class="select select-bordered select-sm" required>
                            <option th:each="c : ${connectors}" th:value="${c.code}"
                                    th:text="${c.name}">시스템</option>
                        </select>
                        <div class="label">
                            <span class="label-text-alt text-base-content/60">실제로 있는 수량</span>
                        </div>
                    </label>
                </div>

                <label class="form-control max-w-md">
                    <div class="label"><span class="label-text font-medium">이름</span></div>
                    <input type="text" name="name" class="input input-bordered input-sm"
                           placeholder="전산 대 물류">
                    <div class="label">
                        <span class="label-text-alt text-base-content/60">
                            비우면 두 시스템 이름으로 자동으로 정합니다
                        </span>
                    </div>
                </label>

                <label class="form-control max-w-md">
                    <div class="label"><span class="label-text font-medium">알릴 기준</span></div>
                    <input type="text" name="alertThreshold" class="input input-bordered input-sm"
                           placeholder="예: 10" inputmode="decimal">
                    <div class="label">
                        <span class="label-text-alt text-base-content/60">
                            이 수를 넘는 차이만 알립니다. 비우면 알리지 않고 화면에만 남깁니다 —
                            낱개 몇 개 차이까지 알리면 알림이 잡음이 됩니다
                        </span>
                    </div>
                </label>

                <div class="flex justify-end">
                    <button type="submit" class="btn btn-primary btn-sm">이대로 정하기</button>
                </div>
            </form>
        </div>
    </div>

    <section th:unless="${#lists.isEmpty(definitions)}">
        <div class="flex items-center gap-3 mb-2">
            <h2 class="text-base font-semibold">정해 둔 대조</h2>
            <span class="text-xs text-base-content/60">
                <b th:text="${#lists.size(definitions)}">0</b>개
            </span>
            <div class="flex-1 h-px bg-base-300"></div>
        </div>

        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-0">
                <div class="overflow-x-auto">
                    <table class="table table-sm">
                        <thead>
                        <tr class="text-xs">
                            <th>이름</th>
                            <th>맞춰 볼 두 곳</th>
                            <th>이 정도 차이는 넘어감</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${definitions}">
                            <td>
                                <a th:href="@{/reconcile/{id}(id=${d.id})}"
                                   class="link link-hover font-medium" th:text="${d.name}">이름</a>
                            </td>
                            <td class="text-sm text-base-content/60">
                                <span th:text="${d.leftSource}">좌</span>
                                <span class="mx-1 text-base-content/40">↔</span>
                                <span th:text="${d.rightSource}">우</span>
                            </td>
                            <td class="font-mono text-xs tabular-nums" th:text="${d.tolerance}">0</td>
                            <td class="text-right">
                                <form th:action="@{/reconcile/{id}/run(id=${d.id})}" method="post">
                                    <button type="submit" class="btn btn-primary btn-sm">지금 맞춰 보기</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

</div>
</body>
</html>
