<!DOCTYPE html>
<!--/* 대조 결과.

       «지금 손댈 것» 과 «지켜볼 것» 을 갈라서 보여준다. 섞으면 둘 다 안 보게 된다 — 목록이
       길어질수록 사람은 위에서부터 훑다가 포기하기 때문이다.

       미매칭은 차이가 아니라 «아직 짝을 못 찾았다» 는 뜻이라 따로 둔다. 같은 자리에 두면
       사람이 재고를 맞추려 들지만, 실제로 할 일은 품목을 연결하는 것이다.

       daisyUI 컴포넌트만 쓴다(07-DECISIONS 009). */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">

    <!--/* 제목과 flash 는 layout 이 그린다(11-UI-RULES T1·B1). */-->
    <div class="flex flex-wrap items-center justify-between gap-3 -mt-4 mb-6">
        <!--/* 못 맞춘 회차는 기준 시각을 정하지 못한 것이라 시각을 말하지 않는다. */-->
        <p class="text-sm text-base-content/60" th:if="${run.success}">
            기준 시각
            <span class="font-mono"
                  th:text="${#temporals.format(run.baseAt, 'yyyy-MM-dd HH:mm:ss')}">시각</span>
        </p>
        <a th:href="@{/reconcile/{id}(id=${definition.id})}" class="btn btn-ghost btn-sm ml-auto">
            ← 맞춰 본 기록
        </a>
    </div>

    <!--/* 실패는 error 하나로 말한다 — 목록의 뱃지·flash 와 같은 색이어야 같은 사실로 읽힌다
           (11-UI-RULES C6). */-->
    <div th:unless="${run.success}" class="alert alert-error mb-6" role="alert">
        <div class="text-sm">
            <b>맞춰 보지 못했습니다.</b>
            <span th:text="${run.message}">사유</span>
        </div>
    </div>

    <div class="flex flex-wrap gap-8 mb-8" th:if="${run.success}">
        <div>
            <div class="text-xs text-base-content/60">지금 볼 것</div>
            <!--/* 0 이면 켜지 않는다. 문제가 있을 때만 색이 붙어야 색이 신호로 남는다. */-->
            <div class="text-xl font-semibold tabular-nums"
                 th:classappend="${#lists.size(confirmed) > 0} ? 'text-warning' : 'text-base-content/40'"
                 th:text="${#lists.size(confirmed)}">0</div>
        </div>
        <div>
            <div class="text-xs text-base-content/60">지켜볼 것</div>
            <div class="text-xl font-semibold tabular-nums text-base-content/60"
                 th:text="${#lists.size(observing)}">0</div>
        </div>
        <div>
            <div class="text-xs text-base-content/60">안 이어진 품목</div>
            <div class="text-xl font-semibold tabular-nums text-base-content/60"
                 th:text="${#lists.size(unmatched)}">0</div>
        </div>
    </div>

    <!--/* 두 번 이상 같은 방향으로 남은 차이. 시간으로 설명되지 않는다. */-->
    <section class="mb-8" th:unless="${#lists.isEmpty(confirmed)}">
        <div class="flex items-center gap-3 mb-2">
            <h2 class="text-base font-semibold">지금 볼 것</h2>
            <span class="text-xs text-base-content/60">
                두 번 이상 같은 방향으로 남았습니다 — 시간 탓이 아닙니다
            </span>
            <div class="flex-1 h-px bg-base-300"></div>
        </div>
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-0">
                <div class="overflow-x-auto">
                    <table class="table table-sm">
                        <thead>
                        <tr class="text-xs">
                            <th class="w-1/5">품목</th>
                            <th class="text-right" th:text="${definition.leftSource}">좌</th>
                            <th class="text-right" th:text="${definition.rightSource}">우</th>
                            <th class="text-right">차이</th>
                            <th>무슨 일인가</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d : ${confirmed}">
                            <td class="font-medium" th:text="${d.unitCode}">품목</td>
                            <td class="text-right font-mono text-xs tabular-nums"
                                th:text="${d.leftText}">0</td>
                            <td class="text-right font-mono text-xs tabular-nums"
                                th:text="${d.rightText}">0</td>
                            <td class="text-right font-mono text-xs tabular-nums font-semibold"
                                th:text="${d.deltaText}">0</td>
                            <td class="text-sm" th:text="${d.summary}">설명</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!--/* 처음 보이는 차이. 반영 지연일 수 있어 아직 알리지 않는다. */-->
    <section class="mb-8" th:unless="${#lists.isEmpty(observing)}">
        <div class="flex items-center gap-3 mb-2">
            <h2 class="text-base font-semibold">지켜볼 것</h2>
            <span class="text-xs text-base-content/60">
                이번에 처음 보입니다 — 반영이 늦은 것일 수 있어 다음에 다시 봅니다
            </span>
            <div class="flex-1 h-px bg-base-300"></div>
        </div>
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-0">
                <div class="overflow-x-auto">
                    <table class="table table-sm">
                        <tbody>
                        <tr th:each="d : ${observing}">
                            <td class="w-1/5 text-base-content/60" th:text="${d.unitCode}">품목</td>
                            <td class="text-right font-mono text-xs tabular-nums text-base-content/60"
                                th:text="${d.deltaText}">0</td>
                            <td class="text-sm text-base-content/60" th:text="${d.summary}">설명</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!--/* 차이가 아니라 «아직 짝을 못 찾았다» 는 뜻이다. 할 일이 다르다. */-->
    <section class="mb-8" th:unless="${#lists.isEmpty(unmatched)}">
        <div class="flex items-center gap-3 mb-2">
            <h2 class="text-base font-semibold">아직 안 이어진 품목</h2>
            <span class="text-xs text-base-content/60">
                재고를 맞출 것이 아니라 <b>품목을 이어야</b> 합니다
            </span>
            <div class="flex-1 h-px bg-base-300"></div>
        </div>
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-0">
                <div class="overflow-x-auto">
                    <table class="table table-sm">
                        <tbody>
                        <tr th:each="d : ${unmatched}">
                            <td class="w-2/5" th:text="${d.unitCode}">품명</td>
                            <td class="text-right font-mono text-xs tabular-nums"
                                th:text="${d.deltaText}">0</td>
                            <td class="text-sm text-base-content/60" th:text="${d.summary}">설명</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <a th:href="@{/reconcile/units}" class="btn btn-outline btn-sm mt-3">품목 이으러 가기</a>
    </section>

    <div th:if="${run.success and #lists.isEmpty(confirmed) and #lists.isEmpty(observing)
                 and #lists.isEmpty(unmatched)}"
         class="card bg-base-100 shadow-sm">
        <div class="card-body items-center text-center py-12">
            <p class="text-base-content/70">어긋난 것이 없습니다.</p>
            <p class="text-sm text-base-content/60">두 곳의 재고가 맞습니다.</p>
        </div>
    </div>

</div>
</body>
</html>
