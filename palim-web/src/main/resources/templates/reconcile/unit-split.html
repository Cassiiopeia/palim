<!DOCTYPE html>
<!--/* 나눠서 묶기 — 통째로 하나로 볼지 갈라서 볼지 고르는 자리.

       자동 후보는 이름이 닮은 것을 «통째로 하나» 로 제안한다. 그런데 로트 셋이 든 줄은
       「+50 하나」 로 볼 수도 있고 「+24 · +26 · 맞음」 셋으로 볼 수도 있다 — 어느 쪽이 맞는
       운영인지는 회사가 정할 일이고, 고를 자리가 없으면 코드가 정해 버린다.

       가르기 전에 «결과» 를 보여준다. 되돌리려면 다시 합쳐야 하므로, 누르기 전에 못 보면
       사람은 안 누르거나 눌러 놓고 수습한다(07-DECISIONS 044).

       daisyUI 컴포넌트만 쓴다(07-DECISIONS 009). 표준값은 11-UI-RULES §0. */-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${title}, ~{::content})}">
<body>
<div th:fragment="content" th:remove="tag">

    <a th:href="@{/reconcile/units(definitionId=${definition.id},tab=${tab})} + '#board'"
       class="btn btn-ghost btn-sm -mt-4 mb-6">← 품목 대조표</a>

    <!--/* 통째로 묶으면 어떻게 되는지 — 견줄 대상이 있어야 «나눌지» 를 판단한다. */-->
    <section class="mb-6">
        <div class="flex items-center gap-3 mb-2">
            <h2 class="text-base font-semibold">통째로 하나로 묶으면</h2>
            <div class="flex-1 h-px bg-base-300"></div>
        </div>
        <div class="card bg-base-100 shadow-sm">
            <div class="card-body flex-row flex-wrap items-center gap-x-8 gap-y-2">
                <div>
                    <div class="text-xs text-base-content/60">묶음 이름</div>
                    <div class="font-medium" th:text="${row.suggestedName()}">이름</div>
                </div>
                <div>
                    <div class="text-xs text-base-content/60"
                         th:text="${definition.leftSource}">좌</div>
                    <div class="text-xl font-semibold tabular-nums"
                         th:text="${row.leftTotalText()}">0</div>
                </div>
                <div>
                    <div class="text-xs text-base-content/60"
                         th:text="${definition.rightSource}">우</div>
                    <div class="text-xl font-semibold tabular-nums"
                         th:text="${row.rightTotalText()}">0</div>
                </div>
                <div>
                    <div class="text-xs text-base-content/60">차이</div>
                    <div class="text-xl font-semibold tabular-nums"
                         th:classappend="${row.hasDiff()} ? 'text-warning' : 'text-base-content/40'"
                         th:text="${row.hasDiff()} ? ${row.diffText()} : '맞음'">0</div>
                </div>
                <div class="flex-1"></div>
                <form th:action="@{/reconcile/units/link}" method="post">
                    <input type="hidden" name="row" th:value="${rowKey}">
                    <input type="hidden" name="definitionId" th:value="${definition.id}">
                    <input type="hidden" name="tab" th:value="${tab}">
                    <button type="submit" class="btn btn-sm">통째로 하나로 묶기</button>
                </form>
            </div>
        </div>
    </section>

    <!--/* 나눠 묶으면 어떻게 되는지. 이쪽이 이 화면의 주 동작이다. */-->
    <section class="mb-6">
        <div class="flex items-center gap-3 mb-2">
            <h2 class="text-base font-semibold">나눠서 묶으면</h2>
            <span class="text-xs text-base-content/60"
                  th:text="${#lists.size(groups)} + '개 묶음이 됩니다'">0개</span>
            <div class="flex-1 h-px bg-base-300"></div>
        </div>

        <form th:action="@{/reconcile/units/split-preview}" method="get"
              class="flex flex-wrap items-center gap-2 mb-3">
            <input type="hidden" name="definitionId" th:value="${definition.id}">
            <input type="hidden" name="row" th:value="${rowKey}">
            <input type="hidden" name="tab" th:value="${tab}">
            <span class="text-sm">무엇으로 갈라서</span>
            <select name="axis" class="select select-bordered select-sm">
                <option th:each="a : ${axes}" th:value="${a.token()}"
                        th:selected="${a.token() == axis.token()}"
                        th:text="${a.label}">기준</option>
            </select>
            <button type="submit" class="btn btn-sm">이렇게 갈라 보기</button>
        </form>

        <div class="card bg-base-100 shadow-sm">
            <div class="card-body p-0">
                <div class="overflow-x-auto">
                    <table class="table table-sm">
                        <thead>
                        <tr class="text-xs">
                            <th>묶음 이름</th>
                            <th th:text="${definition.leftSource}">좌</th>
                            <th th:text="${definition.rightSource}">우</th>
                            <th class="text-right">차이</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="g : ${groups}">
                            <td class="font-medium text-sm" th:text="${g.name}">이름</td>
                            <td class="text-sm">
                                <div th:each="i : ${g.items}"
                                     th:if="${i.source == definition.leftSource}"
                                     class="flex items-baseline gap-2">
                                    <span class="font-mono text-xs text-base-content/60"
                                          th:text="${i.itemRef}">코드</span>
                                    <span class="tabular-nums" th:text="${i.quantityText()}">0</span>
                                </div>
                            </td>
                            <td class="text-sm">
                                <div th:each="i : ${g.items}"
                                     th:if="${i.source != definition.leftSource}"
                                     class="flex items-baseline gap-2">
                                    <span class="font-mono text-xs text-base-content/60"
                                          th:text="${i.itemRef}">코드</span>
                                    <span class="tabular-nums" th:text="${i.quantityText()}">0</span>
                                </div>
                            </td>
                            <td class="text-right tabular-nums text-sm"
                                th:classappend="${g.hasDiff(definition.leftSource)} ? 'text-warning font-medium' : 'text-base-content/40'"
                                th:text="${g.diffText(definition.leftSource)}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:if="${#lists.size(groups) < 2}" class="text-sm text-base-content/60 mt-3">
            이 기준으로는 하나로 남습니다. 다른 기준을 골라 보세요.
        </div>
        <form th:if="${#lists.size(groups) >= 2}"
              th:action="@{/reconcile/units/split-link}" method="post" class="mt-3">
            <input type="hidden" name="definitionId" th:value="${definition.id}">
            <input type="hidden" name="row" th:value="${rowKey}">
            <input type="hidden" name="axis" th:value="${axis.token()}">
            <input type="hidden" name="tab" th:value="${tab}">
            <button type="submit" class="btn btn-primary btn-sm"
                    th:text="${#lists.size(groups)} + '개 묶음으로 나눠서 묶기'">나눠서 묶기</button>
        </form>
    </section>

</div>
</body>
</html>
